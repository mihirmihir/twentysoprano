<style>
  :root {
    color-scheme: only light;
    --parchment: #efe1cb;
    --ink: #241b12;
    --ink-muted: #6b5c48;
    --amber: #d9752c;
    --img-size: clamp(197px, 49.7vw, 435px);
    --gap-major: clamp(1.4rem, 3vw, 2.1rem);
    --gap-minor: clamp(1.05rem, 2.3vw, 1.6rem);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--parchment); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: "Jost", ui-sans-serif, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 2.5rem 1.25rem 1.5rem;
  }
  .main-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .composition {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 600px;
    width: 100%;
  }
  .stack-word {
    font-family: "Workbench", ui-monospace, monospace;
    font-variation-settings: "BLED" 9, "SCAN" -25;
    font-weight: 400;
    font-size: clamp(30px, 5.6vw, 46px);
    white-space: pre;
    line-height: 1;
    text-align: center;
  }
  .stack-word.top-word { margin-bottom: 0.22em; }
  .crown .stack-word { color: var(--ink); font-size: clamp(38px, 7.2vw, 58px); }
  .title .stack-word { color: var(--amber); font-size: clamp(46px, 8.6vw, 68px); }
  .subcrown {
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 500;
    font-size: clamp(13px, 1.8vw, 16px);
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    text-align: center;
    margin-top: var(--gap-minor);
  }
  .image-wrap {
    width: var(--img-size);
    height: var(--img-size);
    overflow: hidden;
    margin-top: var(--gap-major);
  }
  .image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .title {
    margin-top: var(--gap-major);
  }
  .status-line {
    font-family: "Space Mono", ui-monospace, monospace;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(16px, 2.3vw, 20px);
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    text-align: center;
    margin-top: var(--gap-major);
  }
  footer {
    text-align: center;
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 400;
    font-size: clamp(10px, 1.2vw, 12px);
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    padding-top: 1.5rem;
  }
  .spinner {
    position: fixed;
    right: clamp(1rem, 3vw, 2.5rem);
    bottom: clamp(1rem, 3vw, 2.5rem);
    width: clamp(74px, 10.35vw, 138px);
    height: clamp(74px, 10.35vw, 138px);
    border-radius: 50%;
    overflow: hidden;
    background: transparent;
    animation: spin-ccw 8s linear infinite;
  }
  .spinner img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  @keyframes spin-ccw {
    to { transform: rotate(-360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }
</style>
</head>
